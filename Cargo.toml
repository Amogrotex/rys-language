[package]
name = "rys"
version = "0.4.0"
edition = "2021"
description = "The RYS programming language — Rapid Yet Safe"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# ZERO dependencies. Everything — lexer, parser, bytecode compiler, VM,
# garbage collector, x86-64 encoder and JIT — is written from scratch in
# this repository. Nothing is downloaded at build time beyond the Rust
# toolchain itself.
[dependencies]
