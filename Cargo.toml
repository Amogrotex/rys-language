[package]
name = "rys"
version = "0.4.0"
edition = "2021"
description = "The RYS programming language — Rapid Yet Safe"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# RYS has no external Cargo dependencies.
[dependencies]

[profile.profiling]
inherits = "release"
debug = true
strip = false
